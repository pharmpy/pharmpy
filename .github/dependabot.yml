version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "daily"
      time: "01:00"
    labels:
      - "dependencies"
    groups:
      dask:
        patterns:
          - "dask"
          - "distributed"
