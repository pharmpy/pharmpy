version = 1

[[annotations]]
path = [
  "**/results.json",
  "tests/testdata/results/*.json",
  "**/command.txt",
  "**/meta.yaml",
  "**/version_and_option_info.txt",
  "**/scmlog.txt",
  ".gitignore",
  ".mailmap",
  ".bumpversion.cfg",
  ".coveragerc",
  "**/*.ext",
  "**/*.phi",
  "**/*.cov",
  "**/*.cor",
  "**/*.coi",
  "**/*.grd",
  "**/*.msf",
  ".devcontainer/**",
  "**/*.tflite",
  "docs/spelling_wordlist.txt"
]
precedence = "override"
SPDX-FileCopyrightText = "None"
SPDX-License-Identifier = "CC0-1.0"


[[annotations]]
path = [
  "docs/images/model.svg",
  "docs/images/tools.svg"
]
precedence = "override"
SPDX-FileCopyrightText = "2018-2026 The Pharmpy Contributors (see AUTHORS.rst)"
SPDX-License-Identifier = ["CC-BY-4.0"]


[[annotations]]
path = [
  "docs/Pharmpy_logo.svg",
  "docs/Pharmpy_logo_dark.svg",
  "docs/pharmr_logo.svg"
]
precedence = "override"
SPDX-FileCopyrightText = "2016 David Khai"
SPDX-License-Identifier = ["CC-BY-SA-3.0", "OFL-1.1"]


[[annotations]]
path = [
  "docs/images/Pharmpy_symbol.svg"
]
precedence = "override"
SPDX-FileCopyrightText = "2016 David Khai"
SPDX-License-Identifier = ["CC-BY-SA-3.0"]
