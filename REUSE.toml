version = 1

[[annotations]]
path = [
  "tests/testdata/results/*.json",
  "**/command.txt",
  "**/meta.yaml",
  "**/version_and_option_info.txt",
  "**/scmlog.txt",
  ".gitignore",
  ".mailmap",
  ".bumpversion.cfg",
  ".coveragerc",
  "**/*.ext",
  "**/*.phi",
  "**/*.cov",
  "**/*.cor",
  "**/*.coi",
  "**/*.grd",
  "**/*.msf",
  ".devcontainer/**",
  "**/*.tflite",
]
precedence = "override"
SPDX-FileCopyrightText = "None"
SPDX-License-Identifier = "CC0-1.0"


[[annotations]]
path = [
 "docs/Pharmpy_logo.svg",
 "docs/Pharmpy_logo_dark.svg"
]
precedence = "override"
